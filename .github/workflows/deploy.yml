name: Production Deploy via Kamal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Ruby & Gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: Restore SSH Key from Encrypted Rails Credentials
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Extract SSH private key from Rails encrypted credentials
          bin/rails runner 'key = Rails.application.credentials.ssh_private_key.to_s.strip; raise "SSH private key not found in credentials!" if key.empty?; File.write(File.expand_path("~/.ssh/id_ed25519"), key + "\n")'
          chmod 600 ~/.ssh/id_ed25519
          
          # SSH connection multiplexing & known hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 10m
            ServerAliveInterval 60
            ServerAliveCountMax 3
            Compression yes
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -t ed25519,rsa "34.27.174.205" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure PostgreSQL Password Matches
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || secrets.MODERN_RAILS_DATABASE_PASSWORD || 'modern_rails_production_password_2026' }}
        run: |
          ssh deploy@34.27.174.205 "docker exec -u postgres modern_rails-db psql -U postgres -c \"ALTER USER postgres WITH PASSWORD '$POSTGRES_PASSWORD';\" 2>/dev/null || true"

      - name: Deploy with Kamal
        env:
          GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || secrets.MODERN_RAILS_DATABASE_PASSWORD || 'modern_rails_production_password_2026' }}
          MODERN_RAILS_DATABASE_PASSWORD: ${{ secrets.MODERN_RAILS_DATABASE_PASSWORD || secrets.POSTGRES_PASSWORD || 'modern_rails_production_password_2026' }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER || 'admin' }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD || 'password123' }}
        run: |
          kamal lock release 2>/dev/null || true
          kamal deploy
