name: Production Deploy via Kamal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Ruby & Gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: Restore SSH Key from Encrypted Rails Credentials
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Extract SSH private key from Rails encrypted credentials
          bin/rails runner 'File.write(File.expand_path("~/.ssh/id_ed25519"), Rails.application.credentials.ssh_private_key.to_s)'
          chmod 600 ~/.ssh/id_ed25519
          
          # SSH connection multiplexing & known hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 10m
            ServerAliveInterval 60
            ServerAliveCountMax 3
            Compression yes
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -t ed25519,rsa "34.27.174.205" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          kamal lock release 2>/dev/null || true
          kamal deploy
