name: Weekly Server Disk Cleanup

on:
  schedule:
    # Every Sunday at 04:00 UTC (13:00 JST)
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    name: Prune Old Docker Containers & Images
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby & Gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal -v 2.12.0 --no-document

      - name: Restore SSH Key from Encrypted Rails Credentials
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          mkdir -p ~/.ssh
          bin/rails runner 'File.write(File.expand_path("~/.ssh/id_ed25519"), Rails.application.credentials.ssh_private_key.to_s)'
          chmod 600 ~/.ssh/id_ed25519
          
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 10m
            ServerAliveInterval 60
            ServerAliveCountMax 3
            Compression yes
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -t ed25519,rsa "34.27.174.205" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run Kamal Prune
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          kamal prune all
