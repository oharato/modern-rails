service: modern_rails

# Healthcheck and deploy timeouts
deploy_timeout: 90
stop_timeout: 10
retain_containers: 3

# Container Image in GCP Artifact Registry (server host is automatically prefixed by Kamal)
image: modern-rails-1786791154/modern-rails-repo/app

# Target Server (Static IP managed by Pulumi)
servers:
  web:
    - <%= ENV["SERVER_IP"] || "34.27.174.205" %>

ssh:
  user: deploy
  keys:
    - ~/.ssh/id_ed25519

# Kamal-proxy configuration
proxy:
  ssl: false
  hosts:
    - <%= ENV["DOMAIN"] || "modern-rails.ohchans.com" %>
    - <%= ENV["SERVER_IP"] || "34.27.174.205" %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

readiness_delay: 2

# GCP Artifact Registry Credentials
registry:
  server: us-central1-docker.pkg.dev
  username: _json_key_base64
  password:
    - GCP_SA_KEY_BASE64

# Secrets injected from .kamal/secrets
env:
  secret:
    - RAILS_MASTER_KEY
    - BASIC_AUTH_USER
    - BASIC_AUTH_PASSWORD
  clear:
    RAILS_ENV: production
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "modern_rails_storage:/rails/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

asset_path: /rails/public/assets

builder:
  arch: amd64
  cache:
    type: registry
    options: mode=max
