# Name of your application. Used to uniquely configure containers.
service: modern_rails

# Name of the container image.
# Must include Docker Hub username (e.g. your_username/modern_rails)
image: <%= ENV["DOCKER_USERNAME"] %>/modern_rails

# Deploy to these servers (managed by Pulumi)
servers:
  web:
    - <%= ENV["SERVER_IP"] || "34.27.174.205" %>

# SSH configuration (using the deploy user created by Pulumi)
ssh:
  user: deploy
  keys:
    - ~/.ssh/id_ed25519

# Kamal-proxy configuration
proxy:
  ssl: false
  host: <%= ENV["SERVER_IP"] || "34.27.174.205" %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 2
    timeout: 10

# Allow Puma 7 seconds to initialize before proxy healthcheck
readiness_delay: 7

# Credentials for your image host
registry:
  username: <%= ENV["DOCKER_USERNAME"] || "your-dockerhub-user" %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - MODERN_RAILS_DATABASE_PASSWORD
    - BASIC_AUTH_USER
    - BASIC_AUTH_PASSWORD
  clear:
    RAILS_ENV: production
    DATABASE_HOST: modern_rails-db
    DATABASE_USER: postgres
    SOLID_QUEUE_IN_PUMA: true

# PostgreSQL Accessory Container
accessories:
  db:
    image: postgres:17-alpine
    host: <%= ENV["SERVER_IP"] || "34.27.174.205" %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: modern_rails_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /home/deploy/postgres-data:/var/lib/postgresql/data

# Aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Storage
volumes:
  - "modern_rails_storage:/rails/storage"

asset_path: /rails/public/assets

# Faster builder configuration with Buildx caching
builder:
  arch: amd64
