service: modern_rails

# Healthcheck and deploy timeouts
deploy_timeout: 30

# Container Image in GCP Artifact Registry (server host is automatically prefixed by Kamal)
image: modern-rails-1786791154/modern-rails-repo/app

# Target Server (Static IP managed by Pulumi)
servers:
  web:
    - <%= ENV["SERVER_IP"] || "34.27.174.205" %>

ssh:
  user: deploy
  keys:
    - ~/.ssh/id_ed25519

# Kamal-proxy configuration
proxy:
  ssl: false
  host: <%= ENV["SERVER_IP"] || "34.27.174.205" %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 2
    timeout: 10

readiness_delay: 7

# GCP Artifact Registry Credentials
registry:
  server: us-central1-docker.pkg.dev
  username: _json_key_base64
  password:
    - GCP_SA_KEY_BASE64

# Secrets injected from .kamal/secrets
env:
  secret:
    - RAILS_MASTER_KEY
    - MODERN_RAILS_DATABASE_PASSWORD
    - BASIC_AUTH_USER
    - BASIC_AUTH_PASSWORD
  clear:
    RAILS_ENV: production
    DATABASE_HOST: modern_rails-db
    DATABASE_USER: postgres
    SOLID_QUEUE_IN_PUMA: true

# PostgreSQL Accessory Container
accessories:
  db:
    image: postgres:17-alpine
    host: <%= ENV["SERVER_IP"] || "34.27.174.205" %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: modern_rails_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /home/deploy/postgres-data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "modern_rails_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  cache:
    type: registry
    options: mode=max
